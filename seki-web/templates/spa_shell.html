{% extends "base.html" %}
{% block head %}
        <link rel="modulepreload" href="/static/wasm/go_engine_wasm.js">
        <link rel="preload"
              href="/static/wasm/go_engine_wasm_bg.wasm"
              as="fetch"
              type="application/wasm"
              crossorigin>
        <script id="bootstrap-data" type="application/json">{{ bootstrap_json|safe }}</script>
        <script src="/static/dist/bundle.js" type="module" defer></script>
{% endblock %}
{% block body %}
        <div id="app-loading" role="status">
            <span class="app-spinner" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><style>.spinner_aj0A{transform-origin:center;animation:spinner_KYSC .75s infinite linear}@keyframes spinner_KYSC{100%{transform:rotate(360deg)}}</style><path d="M12,4a8,8,0,0,1,7.89,6.7A1.53,1.53,0,0,0,21.38,12h0a1.5,1.5,0,0,0,1.48-1.75,11,11,0,0,0-21.72,0A1.5,1.5,0,0,0,2.62,12h0a1.53,1.53,0,0,0,1.49-1.3A8,8,0,0,1,12,4Z" class="spinner_aj0A"/></svg></span>
            <span class="app-loading-label">Loading</span>
        </div>
        <div id="app-fallback" hidden>
            <div>
                <p>Seki couldn&rsquo;t load.</p>
                <button type="button" onclick="location.reload()">Reload</button>
            </div>
        </div>
        <script>
            // If the app never mounts (chunk 404, JS crash, wasm init failure,
            // stuck fetch), show a static fallback instead of a blank page.
            // Once the app mounts it clears body, removing these elements, so
            // later errors are no-ops.
            (function () {
                function showFallback() {
                    var loading = document.getElementById("app-loading");
                    if (loading) { loading.hidden = true; }
                    var el = document.getElementById("app-fallback");
                    if (el) { el.hidden = false; }
                }
                window.addEventListener("error", showFallback);
                window.addEventListener("unhandledrejection", showFallback);
                setTimeout(showFallback, 8000);
            })();
        </script>
{% endblock %}
