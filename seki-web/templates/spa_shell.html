<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Seki</title>
        <meta name="description" content="Seki">
        <meta name="keywords" content="go,weiqi,baduk">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="color-scheme" content="light dark">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="theme_color"
              content="#fff"
              media="(prefers-color-scheme: light)">
        <meta name="theme_color"
              content="#282828"
              media="(prefers-color-scheme: dark)">
        <link rel="manifest" href="/manifest.json">
        <meta property="og:site_name" content="Seki">
        <meta property="og:type" content="website">
        <meta property="og:title" content="Seki — Play Go Online">
        <meta property="og:description"
              content="Play Go (Weiqi/Baduk) online with friends">
        <link rel="icon"
              id="favicon"
              href="/static/images/favicon-light.svg"
              type="image/svg+xml">
        <script>
            (function() {
                var m = localStorage.getItem("seki:theme") || "auto";
                var d = m === "dark" || (m === "auto" && matchMedia("(prefers-color-scheme:dark)").matches);
                document.documentElement.dataset.theme = d ? "dark" : "light";
                var q = matchMedia("(prefers-color-scheme:dark)");
                function setFavicon(dark) { document.getElementById("favicon").href = "/static/images/favicon-" + (dark ? "dark" : "light") + ".svg"; }
                setFavicon(q.matches);
                q.addEventListener("change", function(e) { setFavicon(e.matches); });
            })();
        </script>
        <link rel="stylesheet" href="/static/css/styles.css">
        <link rel="modulepreload" href="/static/wasm/go_engine_wasm.js">
        <link rel="preload"
              href="/static/wasm/go_engine_wasm_bg.wasm"
              as="fetch"
              type="application/wasm"
              crossorigin>
        <script id="bootstrap-data" type="application/json">{{ bootstrap_json|safe }}</script>
        <script src="/static/dist/bundle.js" type="module" defer></script>
    </head>
    <body>
        <div id="app-loading" role="status">
            <img src="/static/images/spinner.svg"
                 alt=""
                 aria-hidden="true"
                 class="app-spinner">
            <span class="app-loading-label">Loading</span>
        </div>
        <div id="app-fallback" hidden>
            <div>
                <p>Seki couldn&rsquo;t load.</p>
                <button type="button" onclick="location.reload()">Reload</button>
            </div>
        </div>
        <script>
            // If the app never mounts (chunk 404, JS crash, wasm init failure,
            // stuck fetch), show a static fallback instead of a blank page.
            // Once the app mounts it clears body, removing these elements, so
            // later errors are no-ops.
            (function () {
                function showFallback() {
                    var loading = document.getElementById("app-loading");
                    if (loading) { loading.hidden = true; }
                    var el = document.getElementById("app-fallback");
                    if (el) { el.hidden = false; }
                }
                window.addEventListener("error", showFallback);
                window.addEventListener("unhandledrejection", showFallback);
                setTimeout(showFallback, 8000);
            })();
        </script>
        <script src="/static/dist/bundle.js" type="module" defer></script>
    </body>
</html>
